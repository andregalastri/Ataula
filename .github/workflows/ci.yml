name: Validate Galastri Ataula
on:
  push:
    branches: [main, "work/galastri-box-drawing"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline build
        run: npm run build
        continue-on-error: true
      - name: Baseline engine tests
        run: npx vitest run --globals packages/table-engine/src/
