name: Validate Galastri Ataula

on:
  push:
    branches: [main, "work/galastri-box-drawing"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:props
      - name: Full suite (upstream Content Editing Case 34 is a known failure)
        id: full
        continue-on-error: true
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Check legacy failure against the documented baseline
        if: steps.full.outcome == 'failure'
        run: node scripts/check-test-baseline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: vitest-results.json
          if-no-files-found: ignore

  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test in VS Code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Test in VS Code (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration
